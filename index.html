<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />

    <!-- Font Family Links for Montserrat and Fraunces -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    />

    <!-- Style link -->
    <link rel="stylesheet" href="./style.css" />

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main class="product-card">
      <!-- Left (image-container) Section -->
      <div class="product-image"></div>
      <!-- Right Section -->
      <section class="product-text">
        <p class="hero">Perfume</p>
        <h1 class="heading">Gabrielle Essence Eau De Parfum</h1>
        <p class="paragraph">
          A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator
          for the House of CHANEL.
        </p>
        <!-- Amount Section -->
        <article class="amount-container">
          <p class="newPrice">$149.99</p>
          <p class="oldPrice">$169.99</p>
        </article>
        <!-- Button Section -->
        <a href="#" class="btn">
          <img src="./design/images/icon-cart.svg" alt="click to buy" />
          <p>Add to Cart</p></a
        >
      </section>
    </main>
  </body>
</html>
